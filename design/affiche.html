<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Open de Saint-Côme — affiche A3</title>
<style>
  /* ==========================================================================
     AFFICHE OFFICIELLE — A3 portrait (297 × 420 mm)
     Palette : Sanzo Wada, combinaison n° 296 (1933), valeurs exactes.
       #f5ecc2 Sulpher Yellow · #d8a37b Ochraceous Salmon
       #71502f Pale Raw Umber · #34454c Slate Color
     Quatre encres en aplats. Aucun dégradé, aucune transparence.
     ========================================================================== */

  @page { size: 297mm 420mm; margin: 0; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 297mm; height: 420mm;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .affiche {
    position: relative;
    width: 297mm; height: 420mm;
    background: #f5ecc2;                 /* crème calcaire */
    overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #34454c;                      /* basalte */
  }

  /* --- filets de cadrage ------------------------------------------------- */
  .filet {
    position: absolute; left: 22mm; right: 22mm;
    height: 0.5mm; background: #71502f;  /* terre d'ombre */
  }
  .filet--haut { top: 30mm; }
  .filet--bas  { top: 366mm; }

  /* --- mention en tête ---------------------------------------------------- */
  .surtitre {
    position: absolute; left: 22mm; top: 21mm;
    font-size: 3.6mm; font-weight: 600;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: #71502f;
  }

  /* --- titre --------------------------------------------------------------- */
  .titre {
    position: absolute; left: 22mm; right: 22mm; top: 44mm;
    font-family: Didot, "Didot LT STD", "Bodoni 72", "Hoefler Text",
                 Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: 37mm;
    line-height: 0.94;
    letter-spacing: -0.018em;
    color: #34454c;
  }
  .titre em { font-style: normal; }

  /* --- sous-titre ---------------------------------------------------------- */
  .soustitre {
    position: absolute; left: 22mm; top: 128mm;
    font-size: 5mm; font-weight: 600;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: #71502f;
  }

  /* --- le diagramme -------------------------------------------------------- */
  .diagramme {
    position: absolute; left: 22mm; top: 152mm;
    width: 253mm; height: 196mm;
  }

  /* --- pied ---------------------------------------------------------------- */
  .date {
    position: absolute; left: 22mm; top: 378mm;
    font-family: Didot, "Didot LT STD", "Bodoni 72", "Hoefler Text",
                 Georgia, "Times New Roman", serif;
    font-size: 16mm; line-height: 1; letter-spacing: -0.01em;
    color: #34454c;
  }
  .lieu {
    position: absolute; right: 22mm; top: 386mm;
    font-size: 4.6mm; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase;
    text-align: right;
    color: #71502f;
  }
</style>
</head>
<body>
<div class="affiche">

  <div class="filet filet--haut"></div>

  <h1 class="titre">Open<br><em>de Saint-Côme</em></h1>

  <div class="soustitre">En doublette</div>

  <!-- ======================================================================
       LE DIAGRAMME
       Une partie de pétanque réduite à sa géométrie : un cercle d'où l'on
       lance, un arc unique, un point minuscule qui organise tout l'espace
       autour de lui, et des distances. Les unités du viewBox sont des
       millimètres réels de l'affiche.
       ====================================================================== -->
  <svg class="diagramme" viewBox="0 0 253 196" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="cadre">
        <rect x="0" y="0" width="253" height="196"/>
      </clipPath>
    </defs>

    <g clip-path="url(#cadre)" fill="none">

      <!-- Les cercles de mesure, centrés sur le but : la distance, seule
           chose que ce jeu mesure vraiment. Coupés par le cadre, ils
           suggèrent que le champ continue au-delà de l'affiche. -->
      <g stroke="#71502f" stroke-width="0.28">
        <circle cx="196" cy="58" r="16"/>
        <circle cx="196" cy="58" r="30"/>
        <circle cx="196" cy="58" r="46"/>
        <circle cx="196" cy="58" r="64"/>
        <circle cx="196" cy="58" r="84"/>
        <circle cx="196" cy="58" r="106"/>
      </g>

      <!-- La trajectoire : un seul arc, de la main au sol. -->
      <path d="M 48 158 Q 116 6 196 58" stroke="#71502f" stroke-width="0.55"/>

      <!-- Le cercle de lancement : d'où tout part. -->
      <circle cx="48" cy="158" r="17" stroke="#71502f" stroke-width="0.8"/>

      <!-- Trois boules, à trois distances. Aucune n'est dessinée : ce sont
           des disques, et c'est leur position qui raconte la partie. -->
      <g fill="#34454c">
        <circle cx="185" cy="74" r="6.5"/>
        <circle cx="215" cy="83" r="6.5"/>
        <circle cx="158" cy="98" r="6.5"/>
      </g>

      <!-- Celle qui tient le point. -->
      <circle cx="185" cy="74" r="10.6" stroke="#d8a37b" stroke-width="0.9"/>

      <!-- Le but. -->
      <circle cx="196" cy="58" r="2.6" fill="#d8a37b"/>

    </g>
  </svg>

  <div class="filet filet--bas"></div>
  <div class="date">15 août</div>
  <div class="lieu">Saint-Côme-d'Olt</div>

</div>
</body>
</html>
